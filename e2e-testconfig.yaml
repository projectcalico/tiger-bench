- testKind: thruput-latency
  numPolicies: 5
  numIdlePolicies: 3
  numServices: 10
  numPods: 7
  duration: 10
  hostNetwork: false
  iterations: 1
  LeaveStandingConfig: true

- testKind: iperf
  numPolicies: 6
  numIdlePolicies: 2
  numServices: 11
  numPods: 6
  duration: 10
  hostNetwork: false
  iterations: 1
  LeaveStandingConfig: true

- testKind: ttfr
  numPolicies: 7
  numServices: 12
  numPods: 8
  duration: 60
  hostNetwork: false
  iterations: 1
  TTFRConfig:
    TestPodsPerNode: 53
    Rate: 2.5

- testKind: dnsperf
  numPolicies: 4
  numServices: 6
  numPods: 4
  duration: 10
  hostNetwork: false
  iterations: 1
  LeaveStandingConfig: true
  DNSPerf:
    # No Mode and TestDNSPolicy off: DNS policy modes and domain-matching policies are
    # Calico Enterprise features, so this cell exercises the dnsperf pods and curl path
    # only. Keep it that way while this runs against OSS Calico.
    TestDNSPolicy: false
    RunStress: false
    NumDomains: 0
